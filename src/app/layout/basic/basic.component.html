<nz-layout>
  <nz-sider
    class="app-sider"
    nzCollapsible
    [nzCollapsed]="isCollapsed"
    [nzTrigger]="null"
    [nzTheme]="themeColor.effectiveMode()"
    nzWidth="220px"
    [nzCollapsedWidth]="80"
  >
    <basic-menus />
  </nz-sider>
  <nz-layout [ngClass]="isCollapsed ? 'content-close' : 'content'">
    <basic-header [isCollapsed]="isCollapsed" (collapsClick)="toggleNavigation()" />
    <nz-content>
      <div class="inner-content-no">
        <router-outlet />
      </div>
    </nz-content>
  </nz-layout>
</nz-layout>

<nz-drawer
  nzPlacement="left"
  [nzVisible]="mobileMenuVisible"
  [nzWidth]="300"
  [nzClosable]="false"
  [nzBodyStyle]="mobileDrawerBodyStyle"
  (nzOnClose)="closeMobileMenu()"
>
  <ng-container *nzDrawerContent>
    <div class="mobile-menu-shell">
      <basic-menus (navigate)="closeMobileMenu()" />
    </div>
  </ng-container>
</nz-drawer>
